<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Nunito', sans-serif;
    width: 420px;
    padding: 10px;
    overflow: hidden;
  }

  #messages {
    display: flex;
    flex-direction: column;
    gap: 6px;
    justify-content: flex-end;
    max-height: 500px;
    overflow: hidden;
  }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(10px) scale(0.95); }
    to   { opacity: 1; transform: none; }
  }

  .msg.fade { opacity: 0; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #ff2d55, #00f2ea);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: white;
    border: 2px solid rgba(255,255,255,0.2);
    overflow: hidden;
  }

  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

  .bubble {
    background: rgba(10, 14, 20, 0.88);
    border-radius: 14px 14px 14px 4px;
    padding: 7px 12px;
    max-width: 340px;
    border: 1px solid rgba(255,255,255,0.07);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .name {
    font-size: 12px; font-weight: 800;
    background: linear-gradient(90deg, #00f2ea, #bf5af2);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1; margin-bottom: 3px;
  }

  .text {
    font-size: 14px; color: #e8edf3; line-height: 1.4;
    word-break: break-word; font-weight: 600;
  }

  /* Color variety for names */
  .color-0 .name { background: linear-gradient(90deg, #00f2ea, #00a8a4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .color-1 .name { background: linear-gradient(90deg, #ff2d55, #ff6b35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .color-2 .name { background: linear-gradient(90deg, #ffd60a, #ff9500); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .color-3 .name { background: linear-gradient(90deg, #39ff14, #00a8a4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .color-4 .name { background: linear-gradient(90deg, #bf5af2, #ff2d55); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<div id="messages"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const user = params.get('user');
  if (!user) {
    document.body.innerHTML = '<p style="color:red;font-family:monospace;padding:10px">?user= parametresi eksik</p>';
    throw new Error('no user');
  }

  const MAX_MESSAGES = 10;
  const MSG_LIFETIME = 12000; // ms
  const container = document.getElementById('messages');
  let colorCounter = 0;

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function addMessage(d) {
    const color = colorCounter++ % 5;
    const nick = d.user?.nickname || d.user?.uniqueId || '?';
    const initial = nick[0].toUpperCase();

    const msg = document.createElement('div');
    msg.className = `msg color-${color}`;
    msg.innerHTML = `
      <div class="avatar">${d.user?.profilePictureUrl ? `<img src="${esc(d.user.profilePictureUrl)}" onerror="this.parentNode.textContent='${initial}'" alt="${initial}">` : initial}</div>
      <div class="bubble">
        <div class="name">${esc(nick)}</div>
        <div class="text">${esc(d.comment || '')}</div>
      </div>`;

    container.appendChild(msg);

    // Keep max messages
    while (container.children.length > MAX_MESSAGES) {
      container.removeChild(container.firstChild);
    }

    // Auto-fade after lifetime
    setTimeout(() => {
      msg.classList.add('fade');
      setTimeout(() => msg.remove(), 500);
    }, MSG_LIFETIME);
  }

  function connect() {
    const es = new EventSource(`/events/${user}`);

    es.addEventListener('chat', ev => {
      addMessage(JSON.parse(ev.data));
    });

    es.onerror = () => {
      setTimeout(connect, 3000);
      es.close();
    };
  }

  connect();
</script>
</body>
</html>
